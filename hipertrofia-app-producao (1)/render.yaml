# Deploy de produção (serviço Render pago): Docker + migrations antes do release.
# Para demonstração temporária gratuita, ver render-free.yaml e docs/deploy-producao.md.
services:
  - type: web
    name: hipertrofia-api
    runtime: docker
    plan: starter
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: npm run prisma:deploy
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUTRITION_AI_MODE
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: CORS_ORIGIN
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
